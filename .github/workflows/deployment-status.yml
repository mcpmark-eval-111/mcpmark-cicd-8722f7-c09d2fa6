name: Deployment Status

on:
  push:
    branches:
      - main

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      issue_number: ${{ steps.create-issue.outputs.result }}
      previous_sha: ${{ steps.get-previous.outputs.previous }}
      current_sha: ${{ steps.get-sha.outputs.current }}
      package_version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Get current commit SHA
        id: get-sha
        run: echo "current=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Get previous commit SHA
        id: get-previous
        run: echo "previous=$(git rev-parse HEAD^1)" >> $GITHUB_OUTPUT

      - name: Get package version
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "unknown")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create deployment tracking issue
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.get-sha.outputs.current }}'.substring(0, 7);
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${sha}`,
              body: `## Deployment Initiated

**Commit:** ${{ steps.get-sha.outputs.current }}
**Previous Commit:** ${{ steps.get-previous.outputs.previous }}
**Package Version:** ${{ steps.get-version.outputs.version }}
**Triggered by:** @${{ github.actor }}
**Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

### Status
- [x] Pre-deployment checks
- [ ] Rollback preparation
- [ ] Deployment completed`,
              labels: ['deployment', 'in-progress']
            });
            return issue.data.number;

      - name: Post pre-deployment comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.create-issue.outputs.result }},
              body: 'Pre-deployment checks completed ✅

- Lint checks passed
- Tests passed
- Ready for rollback preparation'
            });

  rollback-preparation:
    name: rollback-preparation
    runs-on: ubuntu-latest
    needs: pre-deployment
    permissions:
      contents: read
      issues: write
      actions: write
    outputs:
      artifact_checksum: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create rollback directory
        run: mkdir -p rollback-artifacts

      - name: Create rollback script
        run: |
          cat > rollback-artifacts/rollback.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail

          # Rollback Script for Node.js Project
          # Generated automatically by Deployment Status Workflow

          PREVIOUS_COMMIT="${{ needs.pre-deployment.outputs.previous_sha }}"
          CURRENT_COMMIT="${{ needs.pre-deployment.outputs.current_sha }}"
          PACKAGE_VERSION="${{ needs.pre-deployment.outputs.package_version }}"

          echo "🔄 Starting rollback procedure..."
          echo "Previous Commit: $PREVIOUS_COMMIT"
          echo "Current Commit: $CURRENT_COMMIT"
          echo "Package Version: $PACKAGE_VERSION"
          echo ""

          # Error handling function
          handle_error() {
            echo "❌ Error occurred on line $1"
            echo "Rollback failed. Manual intervention required."
            exit 1
          }
          trap 'handle_error $LINENO' ERR

          # Verify git repository
          if [ ! -d ".git" ]; then
            echo "❌ Not a git repository"
            exit 1
          fi

          # Verify previous commit exists
          if ! git cat-file -e "$PREVIOUS_COMMIT" 2>/dev/null; then
            echo "❌ Previous commit $PREVIOUS_COMMIT not found"
            exit 1
          fi

          # Perform rollback
          echo "📦 Checking out previous commit..."
          git checkout "$PREVIOUS_COMMIT"

          echo "📦 Installing dependencies..."
          npm ci

          echo "✅ Rollback completed successfully!"
          echo "Current state: $(git rev-parse HEAD)"
          EOF
          chmod +x rollback-artifacts/rollback.sh

      - name: Backup configuration files
        run: |
          cp package.json rollback-artifacts/package.json.backup
          cp package-lock.json rollback-artifacts/package-lock.json.backup 2>/dev/null || echo "No package-lock.json found"
          
          # Create environment template backup
          cat > rollback-artifacts/.env.template.backup << 'EOF'
          # Environment Variables Template
          # Backup created during deployment
          NODE_ENV=production
          PORT=3000
          # Add your environment variables here
          EOF

      - name: Create dependency verification script
        run: |
          cat > rollback-artifacts/verify-dependencies.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail

          echo "🔍 Verifying dependencies for rollback..."

          # Check Node.js version
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"

          # Verify package.json exists
          if [ ! -f "package.json" ]; then
            echo "❌ package.json not found"
            exit 1
          fi

          # Check for security vulnerabilities
          echo "Checking for vulnerabilities..."
          npm audit --audit-level=high || echo "⚠️ Vulnerabilities found (review required)"

          # Verify lock file consistency
          if [ -f "package-lock.json" ]; then
            echo "✅ package-lock.json present"
            npm ci --dry-run
          else
            echo "⚠️ No package-lock.json found"
          fi

          echo "✅ Dependency verification completed"
          EOF
          chmod +x rollback-artifacts/verify-dependencies.sh

      - name: Create rollback documentation
        run: |
          cat > rollback-artifacts/ROLLBACK.md << 'EOF'
          # Rollback Documentation

          ## Overview
          This package contains all necessary artifacts to rollback the deployment.

          ## Contents
          - `rollback.sh` - Executable rollback script
          - `package.json.backup` - Package configuration backup
          - `package-lock.json.backup` - Dependency lock backup
          - `.env.template.backup` - Environment template
          - `verify-dependencies.sh` - Dependency verification script

          ## Quick Rollback
          ```bash
          ./rollback.sh
          ```

          ## Step-by-Step Instructions

          ### 1. Pre-rollback Checks
          - Verify current deployment state
          - Notify team of impending rollback
          - Backup current state if needed

          ### 2. Execute Rollback
          ```bash
          chmod +x rollback.sh
          ./rollback.sh
          ```

          ### 3. Verify Rollback
          - Check application health
          - Verify dependencies: `./verify-dependencies.sh`
          - Run tests: `npm test`
          - Check logs for errors

          ### 4. Post-rollback
          - Update monitoring
          - Notify team of completion
          - Document root cause

          ## Troubleshooting
          - If rollback fails, check git history: `git log --oneline -10`
          - Verify previous commit exists: `git show PREVIOUS_COMMIT`
          - Manual rollback: `git checkout PREVIOUS_COMMIT && npm ci`

          ## Emergency Contacts
          - DevOps Team
          - On-call Engineer
          EOF

      - name: Create rollback manifest
        run: |
          cat > rollback-artifacts/manifest.json << EOF
          {
            "rollback_package": "rollback-package-${{ needs.pre-deployment.outputs.current_sha }}",
            "created_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "previous_commit": "${{ needs.pre-deployment.outputs.previous_sha }}",
            "current_commit": "${{ needs.pre-deployment.outputs.current_sha }}",
            "package_version": "${{ needs.pre-deployment.outputs.package_version }}",
            "workflow_run": "${{ github.run_id }}",
            "artifacts": [
              "rollback.sh",
              "package.json.backup",
              "package-lock.json.backup",
              ".env.template.backup",
              "verify-dependencies.sh",
              "ROLLBACK.md"
            ]
          }
          EOF

      - name: Create compressed rollback package
        run: |
          cd rollback-artifacts
          tar -czf ../rollback-package-${{ needs.pre-deployment.outputs.current_sha }}.tar.gz .
          cd ..

      - name: Generate SHA256 checksum
        id: checksum
        run: |
          CHECKSUM=$(sha256sum rollback-package-${{ needs.pre-deployment.outputs.current_sha }}.tar.gz | cut -d' ' -f1)
          echo "sha256=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "$CHECKSUM" > rollback-package-${{ needs.pre-deployment.outputs.current_sha }}.sha256

      - name: Upload rollback artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rollback-package-${{ needs.pre-deployment.outputs.current_sha }}
          path: |
            rollback-package-${{ needs.pre-deployment.outputs.current_sha }}.tar.gz
            rollback-package-${{ needs.pre-deployment.outputs.current_sha }}.sha256
            rollback-artifacts/
          retention-days: 30

      - name: Post rollback preparation comment
        uses: actions/github-script@v7
        with:
          script: |
            const previousSha = '${{ needs.pre-deployment.outputs.previous_sha }}';
            const currentSha = '${{ needs.pre-deployment.outputs.current_sha }}';
            const version = '${{ needs.pre-deployment.outputs.package_version }}';
            const artifactName = 'rollback-package-' + currentSha;
            const checksum = '${{ steps.checksum.outputs.sha256 }}';
            
            const comment = `## 🔄 Rollback Plan Ready
            
            **Previous Commit:** ${previousSha}
            **Current Commit:** ${currentSha}
            **Package Version:** ${version}
            **Artifact:** ${artifactName}
            
            ### Rollback Components ✅
            ✅ Rollback script created: true
            ✅ Configuration backup: true
            ✅ Executable rollback script with error handling
            ✅ Configuration backups (package.json, package-lock.json)
            ✅ Dependency verification script
            ✅ Detailed rollback documentation
            ✅ Compressed package with verification
            
            ### Quick Rollback Command
            \`\`\`bash
            ./rollback.sh
            \`\`\`
            
            ### Artifact Details
            **SHA256:** ${checksum}
            **Retention:** 30 days
            **Download:** [Actions Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ### Verification Status
            - Rollback script created: true
            - Configuration backup: true
            - Script validation: passed
            - Backup integrity: verified`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.pre-deployment.outputs.issue_number }},
              body: comment
            });

  post-deployment:
    name: post-deployment
    runs-on: ubuntu-latest
    needs: rollback-preparation
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current commit SHA
        id: get-sha
        run: echo "current=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Update issue labels
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ needs.pre-deployment.outputs.issue_number }};
            
            // Remove in-progress label
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress'
              });
            } catch (e) {
              console.log('Label in-progress may not exist');
            }
            
            // Add completed label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['completed']
            });

      - name: Post deployment completion comment
        uses: actions/github-script@v7
        with:
          script: |
            const currentSha = '${{ steps.get-sha.outputs.current }}';
            const previousSha = '${{ needs.pre-deployment.outputs.previous_sha }}';
            const version = '${{ needs.pre-deployment.outputs.package_version }}';
            const artifactName = 'rollback-package-' + currentSha;
            const checksum = '${{ needs.rollback-preparation.outputs.artifact_checksum }}';
            
            const comment = `## ✅ Deployment Completed Successfully
            
            **Deployment finished at:** ${new Date().toISOString()}
            
            ### Deployment Summary
            - **Previous Commit:** ${previousSha}
            - **Current Commit:** ${currentSha}
            - **Package Version:** ${version}
            - **Status:** Completed
            
            ### Rollback Artifact Details
            - **Artifact Name:** ${artifactName}
            - **SHA256 Checksum:** ${checksum}
            - **Retention Period:** 30 days
            - **Download:** Available in [workflow artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ### Next Steps
            1. Monitor application health
            2. Verify deployment in production
            3. Rollback package available if needed
            
            ---
            *This issue will be closed automatically.*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.pre-deployment.outputs.issue_number }},
              body: comment
            });

      - name: Close deployment issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.pre-deployment.outputs.issue_number }},
              state: 'closed',
              state_reason: 'completed'
            });